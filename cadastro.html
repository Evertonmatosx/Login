<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">

    <title>Cadastro</title>
</head>

<body>

    <main class="container">

        <form id="cadastroForm">

            <h1>Cadastro</h1>

            <div class="input-box">
                <input
                    id="nome"
                    placeholder="Nome"
                    type="text"
                    required
                >

                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input
                    id="usuario"
                    placeholder="E-mail"
                    type="email"
                    required
                >

                <i class="bx bxs-envelope"></i>
            </div>

            <div class="input-box">
                <input
                    id="senha"
                    placeholder="Senha"
                    type="password"
                    required
                >

                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-box">
                <input
                    id="confirmarSenha"
                    placeholder="Confirmar senha"
                    type="password"
                    required
                >

                <i class="bx bxs-lock-alt"></i>
            </div>

            <button type="submit" class="login">
                Cadastrar
            </button>

            <div class="register-link">

                <p>
                    Já tem uma conta?
                    <a href="index.html">
                        Faça login
                    </a>
                </p>

            </div>

        </form>

    </main>

    <script src="cadastro.js"></script>

</body>

</html>
